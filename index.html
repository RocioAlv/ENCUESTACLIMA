<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Encuesta de Clima · Evolución</title>
<style>
  :root{
    --navy:#083A4F;
    --gold:#A58D66;
    --aqua:#C0D5D6;
    --teal:#407E8C;
    --sand:#E5E1DD;
    --white:#FFFFFF;
    --danger:#C0522D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--navy);
    color:var(--navy);
  }
  .wrap{max-width:560px;margin:0 auto;padding:24px 18px 60px;}

  header{ text-align:center; margin-bottom:18px; }
  header h1{ color:var(--white); font-size:21px; margin:0 0 4px; }
  header p{ color:var(--aqua); font-size:13px; margin:0; }

  #estado{ color:var(--aqua); text-align:center; font-size:14px; padding:20px; }
  #estado.error{ color:#F2B4A0; }

  .tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:18px;
    padding-bottom:2px;
  }
  .tab{
    flex-shrink:0;
    background:rgba(255,255,255,.08);
    color:var(--white);
    border:1px solid rgba(255,255,255,.25);
    border-radius:20px;
    padding:8px 16px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .tab.activo{ background:var(--gold); border-color:var(--gold); }

  #panel{ display:none; }
  #panel.show{ display:block; }

  .card{
    background:var(--white);
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 8px 24px rgba(0,0,0,.15);
  }
  .card h2{ font-size:14px; margin:0 0 4px; color:var(--navy); }
  .card .sub{ font-size:12px; color:#667; margin:0 0 14px; }

  .delta{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    padding:3px 10px;
    border-radius:20px;
    margin-left:8px;
    color:var(--white);
  }
  .delta.pos{ background:var(--teal); }
  .delta.neg{ background:var(--danger); }
  .delta.neutro{ background:#9AA5AD; }

  svg{ width:100%; height:auto; display:block; }
  .punto-label{ font-size:10px; fill:#556; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  .eje-label{ font-size:10px; fill:#889; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }

  .dim-row{ margin-bottom:14px; }
  .dim-row:last-child{ margin-bottom:0; }
  .dim-top{
    display:flex;
    justify-content:space-between;
    font-size:13.5px;
    font-weight:600;
    margin-bottom:6px;
  }
  .dim-top span:last-child{ color:var(--teal); }
  .bar-bg{ background:var(--sand); border-radius:6px; height:9px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; background:var(--teal); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Encuesta de Clima</h1>
    <p>Evolución de resultados por área</p>
  </header>

  <div id="estado">Cargando datos...</div>
  <div class="tabs" id="tabs"></div>

  <div id="panel">
    <div class="card">
      <h2 id="tendencia-titulo">Evolución del Índice de Engagement</h2>
      <p class="sub" id="tendencia-sub"></p>
      <div id="grafico"></div>
    </div>

    <div class="card">
      <h2>Último período · por dimensión</h2>
      <p class="sub" id="ultimo-periodo-label"></p>
      <div id="dimensiones"></div>
    </div>
  </div>
</div>

<script>
  // ⚠️ Pegá acá la URL de tu Apps Script (termina en /exec)
  const API_URL = "https://script.google.com/macros/s/AKfycbw68wPZC6vAz_GLNMYXZDyN3OHxbh3qIqeEzVWdQsTLt8NdWYRAHRqBTuEY2mPaUSnXDg/exec";

  const estadoEl = document.getElementById('estado');
  const tabsEl = document.getElementById('tabs');
  const panelEl = document.getElementById('panel');

  let DATA = null;
  let areaActual = null;

  fetch(API_URL)
    .then(r => r.json())
    .then(data => {
      DATA = data;
      if (!data.areas || !data.areas.length) {
        estadoEl.textContent = 'La planilla no tiene columnas de área cargadas.';
        estadoEl.className = 'error';
        return;
      }
      estadoEl.style.display = 'none';
      construirTabs();
      seleccionarArea(DATA.areas[0]);
    })
    .catch(() => {
      estadoEl.textContent = 'No se pudo conectar. Revisá la URL del Apps Script.';
      estadoEl.className = 'error';
    });

  function construirTabs(){
    tabsEl.innerHTML = '';
    DATA.areas.forEach(area => {
      const btn = document.createElement('button');
      btn.className = 'tab';
      btn.textContent = etiquetaArea(area);
      btn.addEventListener('click', () => seleccionarArea(area));
      btn.dataset.area = area;
      tabsEl.appendChild(btn);
    });
  }

  function etiquetaArea(area){
    if (area.toUpperCase() === 'GENERAL') return 'General';
    return area.charAt(0) + area.slice(1).toLowerCase();
  }

  function seleccionarArea(area){
    areaActual = area;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('activo', t.dataset.area === area);
    });
    panelEl.classList.add('show');
    dibujarTendencia(area);
    dibujarDimensiones(area);
  }

  // Encuentra la dimensión "insignia" (índice de engagement) sin depender
  // de mayúsculas/acentos exactos, para que sobreviva a como la escriban.
  function normalizar(txt){
    return (txt || '').toString().toUpperCase()
      .replace(/[ÁÀÄ]/g,'A').replace(/[ÉÈË]/g,'E').replace(/[ÍÌÏ]/g,'I')
      .replace(/[ÓÒÖ]/g,'O').replace(/[ÚÙÜ]/g,'U');
  }

  function dimensionEngagement(){
    return DATA.dimensiones.find(d => normalizar(d).includes('ENGAGEMENT')) || DATA.dimensiones[0];
  }

  function dibujarTendencia(area){
    const dim = dimensionEngagement();
    document.getElementById('tendencia-titulo').textContent = 'Evolución · ' + dim;
    document.getElementById('tendencia-sub').textContent = etiquetaArea(area);

    const puntos = DATA.periodos.map(periodo => {
      const fila = DATA.datos.find(d => d.periodo === periodo && d.dimension === dim);
      return { periodo: periodo, valor: fila ? fila.valores[area] : null };
    }).filter(p => p.valor !== null && p.valor !== undefined);

    const cont = document.getElementById('grafico');
    if (puntos.length < 2){
      cont.innerHTML = '<p class="sub">No hay suficientes períodos para graficar todavía.</p>';
      return;
    }

    const w = 480, h = 200, padL = 34, padR = 16, padT = 16, padB = 28;
    const minV = 0, maxV = 100;
    const xStep = (w - padL - padR) / (puntos.length - 1);
    const y = v => padT + (h - padT - padB) * (1 - (v - minV) / (maxV - minV));
    const x = i => padL + i * xStep;

    let path = '';
    puntos.forEach((p, i) => {
      path += (i === 0 ? 'M' : 'L') + x(i) + ',' + y(p.valor) + ' ';
    });

    let svg = '<svg viewBox="0 0 ' + w + ' ' + h + '">';
    // líneas guía horizontales
    [0, 50, 100].forEach(v => {
      svg += '<line x1="' + padL + '" y1="' + y(v) + '" x2="' + (w - padR) + '" y2="' + y(v) + '" stroke="#E5E1DD" stroke-width="1"/>';
      svg += '<text class="eje-label" x="4" y="' + (y(v) + 3) + '">' + v + '%</text>';
    });
    svg += '<path d="' + path + '" fill="none" stroke="#407E8C" stroke-width="2.5"/>';
    puntos.forEach((p, i) => {
      svg += '<circle cx="' + x(i) + '" cy="' + y(p.valor) + '" r="4" fill="#A58D66"/>';
      svg += '<text class="punto-label" x="' + x(i) + '" y="' + (h - 8) + '" text-anchor="middle">' + p.periodo + '</text>';
      svg += '<text class="punto-label" x="' + x(i) + '" y="' + (y(p.valor) - 10) + '" text-anchor="middle" font-weight="700">' + p.valor + '%</text>';
    });
    svg += '</svg>';
    cont.innerHTML = svg;

    // delta vs período anterior, al lado del título
    const tit = document.getElementById('tendencia-titulo');
    const viejoDelta = tit.querySelector('.delta');
    if (viejoDelta) viejoDelta.remove();
    if (puntos.length >= 2){
      const diff = puntos[puntos.length - 1].valor - puntos[puntos.length - 2].valor;
      const span = document.createElement('span');
      span.className = 'delta ' + (diff > 0 ? 'pos' : diff < 0 ? 'neg' : 'neutro');
      span.textContent = (diff > 0 ? '+' : '') + diff + ' pts';
      tit.appendChild(span);
    }
  }

  function dibujarDimensiones(area){
    const ultimoPeriodo = DATA.periodos[DATA.periodos.length - 1];
    document.getElementById('ultimo-periodo-label').textContent = ultimoPeriodo + ' · ' + etiquetaArea(area);

    const filas = DATA.datos.filter(d => d.periodo === ultimoPeriodo && d.valores[area] !== null && d.valores[area] !== undefined);
    const cont = document.getElementById('dimensiones');
    cont.innerHTML = '';
    if (!filas.length){
      cont.innerHTML = '<p class="sub">No hay datos de esta área para el último período.</p>';
      return;
    }
    filas.forEach(f => {
      const valor = f.valores[area];
      const row = document.createElement('div');
      row.className = 'dim-row';
      row.innerHTML =
        '<div class="dim-top"><span>' + f.dimension + '</span><span>' + valor + '%</span></div>' +
        '<div class="bar-bg"><div class="bar-fill" style="width:' + valor + '%"></div></div>';
      cont.appendChild(row);
    });
  }
</script>
</body>
</html>
